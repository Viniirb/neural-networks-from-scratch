name: Relatar um problema
description: Informe um erro reproduzível em um exemplo ou na documentação.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que era esperado?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Inclua módulo, comando e dados mínimos necessários.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Python 3.11, Windows 11, CPU
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      render: shell
